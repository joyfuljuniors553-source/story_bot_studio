name: Status page

# Rebuilds the public status page from the bot's saved state, without making
# or uploading any video. The daily run already refreshes the page; this is for
# seeing a change to the page right away, or refreshing it by hand.

on:
  workflow_dispatch:

# Only one page build at a time; a newer request replaces an older one.
concurrency:
  group: status-page
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Restore the bot's state
        run: |
          set -e
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin bot-state
            git archive origin/bot-state | tar -x -C .
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      # Channel list and logins, so the page knows which channels are connected.
      - name: Restore private files
        env:
          BOT_SECRETS_B64: ${{ secrets.BOT_SECRETS_B64 }}
        run: python scripts/ci_secrets.py unpack

      - name: Build the status page
        run: python scripts/build_status_page.py site

      # This repo is private, so the page lives in a small public repo of its own.
      - name: Publish the status page
        env:
          DEPLOY_KEY: ${{ secrets.STATUS_PAGE_DEPLOY_KEY }}
        run: |
          set -e
          key="$RUNNER_TEMP/status_page_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          touch site/.nojekyll
          cd site
          git init -q -b main
          git config user.name  "storybot"
          git config user.email "storybot@users.noreply.github.com"
          git add -A
          git commit -q -m "status $(date -u '+%Y-%m-%d %H:%M UTC')"
          GIT_SSH_COMMAND="ssh -i $key -o StrictHostKeyChecking=accept-new" \
            git push -f git@github.com:joyfuljuniors553-source/story-bot-studio.git main
          rm -rf .git "$key"
